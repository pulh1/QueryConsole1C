schema: spec-driven

context: |

  ## Продукт

  Расширенная консоль запросов для 1С:Предприятие с поддержкой исполняемых представлений.

  Проект позволяет выполнять запросы 1С с обращением к источникам данных, которые реализованы не только
  через стандартные таблицы и виртуальные таблицы платформы, но и через программную бизнес-логику 1С.
  Основной сценарий — работа с данными ЗУП через методы программного интерфейса, регистры, шаблоны
  получения данных и специализированные исполняемые представления.

  Система включает:

  * расширенный язык запросов 1С;
  * лексер, парсер и AST;
  * семантический анализатор;
  * реестр и поставщики исполняемых представлений;
  * исполнитель запросов;
  * оптимизации выполнения, включая pushdown фильтров и проекций;
  * материализацию данных во временные таблицы при необходимости;
  * конструктор запросов;
  * генерацию BSL-кода по модели запроса;
  * генерацию запросов/настроек для СКД и универсального отчёта.

  ## Технологический стек

  * Платформа: 1С:Предприятие 8.3
  * Целевая версия платформы: 8.3.27
  * Язык: BSL, весь код на русском языке
  * IDE: 1C:EDT
  * Формат проекта: проектная структура EDT
  * Основная предметная область: ЗУП 3.1 и программный интерфейс ЗУП
  * Тестирование: YAxUnit, если тесты доступны в проекте
  * Проверка качества: диагностика EDT, статический анализ BSL, существующие проверки проекта
  * Инструменты анализа: файловый поиск, структурный анализ BSL, EDT-aware/MCP-инструменты при доступности

  ## Структура проекта

  * Исходники 1С расположены в EDT-структуре проекта.
  * Перед изменениями нужно определить фактический корень исходников и имя EDT-проекта.
  * Не выводить пути только из предположений; проверять фактическое расположение файлов и объектов.

  Основные области проекта:

  * ядро разбора языка запросов;
  * модель запроса и AST;
  * семантический анализ;
  * обработка исполняемых представлений;
  * реестр/поставщики исполняемых представлений;
  * исполнитель запроса;
  * генерация BSL-кода;
  * конструктор запросов и управляемые формы;
  * универсальный отчёт и интеграция с СКД;
  * ЗУП-специфичные исполняемые представления.

  ## Архитектурные принципы

  * Разделять синтаксический анализ, семантический анализ, планирование и исполнение запроса.
  * Не смешивать модель запроса, UI конструктора и runtime-исполнение.
  * Для новых исполняемых представлений описывать контракт: имя, параметры, поля, типы, источник данных и стратегию выполнения.
  * При изменении языка запросов учитывать влияние на парсер, AST, семантический анализатор, конструктор, генерацию кода и обратную совместимость существующих запросов.
  * При изменении исполнителя учитывать pushdown-оптимизации, материализацию во временные таблицы и корректность результата.
  * Для ЗУП-специфичной логики предпочитать использование штатного программного интерфейса и существующих механизмов конфигурации.
  * Не добавлять прямые зависимости между независимыми слоями, если задачу можно решить через контракт, стратегию, поставщика или реестр.

  ## Соглашения по именованию

  * Имена метаданных 1С — на русском языке, CamelCase.
  * Имена модулей, процедур, функций, структур и полей — на русском языке.
  * Новые сущности должны соответствовать терминологии проекта: запрос, источник, поле, параметр, представление, исполняемое представление, модель запроса, узел AST, контекст исполнения.
  * Не вводить новые англоязычные термины, если в проекте уже есть русскоязычный аналог.
  * Не переименовывать существующие публичные методы, модули и объекты без отдельного обоснования.

  ## Стандарты кода

  * Соблюдать существующий стиль BSL-кода проекта.
  * Предпочитать стандартные механизмы платформы 1С и БСП, если они применимы.
  * Не использовать `Попытка ... Исключение` для обычного контроля потока.
  * Не использовать `Сообщить()` для логирования, если это явно не требуется задачей.
  * Не использовать `ЗаписьЖурналаРегистрации()` без явного требования.
  * Для запросов использовать параметры `&Параметр`, а не конкатенацию пользовательских значений в текст запроса.
  * Для сложных запросов использовать читаемое форматирование и временные таблицы.
  * При добавлении новых методов писать описание в стиле проекта, если в модуле уже используются описания методов.
  * Не менять публичный программный интерфейс без необходимости.
  * Не исправлять попутно unrelated diagnostics и старые ошибки, если они не относятся к задаче.

  ## Работа с EDT и метаданными

  * Для обычных `.bsl` файлов допустим файловый поиск, чтение и локальное редактирование.
  * Для метаданных, форм, СКД, расширений и сгенерированных EDT-файлов предпочитать EDT-aware инструменты, если они доступны.
  * Перед изменением формы, СКД или объекта метаданных сначала изучать фактическое состояние объекта.
  * Не редактировать `.mdo` вручную, если доступен безопасный EDT-aware способ изменения.
  * После значимых изменений запускать доступную диагностику проекта.
  * Не утверждать, что диагностика или тесты выполнены, если они фактически не запускались.

  ## Антигаллюцинации

  Нельзя предполагать существование объекта, модуля, метода, реквизита, формы, команды, обработчика или API.

  Перед использованием нужно проверить:

  * наличие объекта метаданных;
  * наличие модуля;
  * наличие метода;
  * сигнатуру метода;
  * экспортность метода;
  * область выполнения кода;
  * наличие реквизита формы или объекта;
  * доступность платформенного API, БСП API или программного интерфейса ЗУП.

  Если проверить невозможно, явно указать, что это предположение.

rules:
  proposal:
    - Описывать, какую проблему решает изменение и в какой части консоли запросов она возникает.
    - Указывать влияние на язык запросов, парсер, AST, семантический анализатор, исполнитель, конструктор запросов и генерацию кода.
    - Указывать влияние на существующие исполняемые представления и обратную совместимость запросов.
    - Отдельно отмечать, затрагивается ли ЗУП-специфичная логика или только общее ядро консоли.
    - Указывать затрагиваемые объекты метаданных 1С, формы, общие модули, обработки, СКД и расширения.
    - Указывать, требуется ли изменение публичного программного интерфейса модулей или можно сохранить существующий контракт.
    - 'Указывать риски: изменение синтаксиса, изменение семантики запроса, деградация pushdown-оптимизаций, нарушение генерации кода, несовместимость с существующими примерами запросов.'

  design:
    - 'Описывать архитектурный слой изменения: парсер, AST, семантика, модель запроса, исполнитель, поставщик представлений, UI конструктора, генерация кода, СКД.'
    - 'Описывать интерфейсы BSL-модулей: экспортные процедуры/функции, параметры, возвращаемые структуры и контекст выполнения.'
    - 'Для новых исполняемых представлений описывать контракт представления: имя, параметры, поля, типы, источник данных, ограничения и стратегию выполнения.'
    - Для изменений языка запросов описывать синтаксис, AST-узлы, правила семантической проверки и влияние на генератор кода.
    - Для изменений исполнителя описывать план выполнения, pushdown фильтров/полей, материализацию временных таблиц и fallback-поведение.
    - Для изменений конструктора запросов описывать влияние на дерево источников, список полей, параметры, связи, условия, сортировку и сериализацию модели.
    - Для изменений СКД/универсального отчёта описывать, как модель запроса преобразуется в настройки отчёта или текст запроса.
    - Включать секцию "Свойства корректности" для валидации реализации.
    - Включать секцию "Совместимость" для оценки влияния на существующие запросы и исполняемые представления.

  tasks:
    - Каждая задача должна быть автономной единицей работы.
    - Включать трассировку к требованиям, proposal и design.
    - Указывать конкретные модули, формы, объекты метаданных или файлы для изменения после фактической проверки структуры проекта.
    - Отдельно выделять задачи на изменение языка/парсера, AST, семантики, исполнителя, UI конструктора, генерации кода, СКД и тестов.
    - Отдельно выделять задачи на создание или изменение исполняемых представлений.
    - Для задач изменения метаданных, форм и СКД указывать необходимость EDT-aware проверки.
    - Для задач изменения BSL указывать, какие методы нужно прочитать, изменить и какие ссылки проверить.
    - 'Для каждой задачи указывать ожидаемую проверку: диагностика EDT, модульные тесты, ручной сценарий в консоли запросов, проверка генерации кода или проверка универсального отчёта.'
    - Не включать в задачи исправление unrelated diagnostics, если это не является отдельным требованием.

  specs:
    - Включать критерии приёмки с конкретными проверяемыми условиями.
    - Для изменений языка запросов приводить примеры валидных и невалидных запросов.
    - Для исполняемых представлений описывать входные параметры, поля результата, типы данных и ожидаемое поведение при пустых/ошибочных параметрах.
    - Для исполнителя описывать ожидаемый результат выполнения и условия материализации во временные таблицы.
    - Для конструктора запросов описывать сценарии добавления источников, выбора полей, настройки параметров, условий, связей и сортировки.
    - Для генерации кода описывать, какой BSL-код должен получиться и какие зависимости он использует.
    - Для универсального отчёта/СКД описывать ожидаемую структуру отчёта, источники данных и ограничения.
    - Указывать проверки обратной совместимости для существующих примеров запросов и исполняемых представлений.
    - Указывать, какие проверки должны быть выполнены автоматически, а какие требуют ручной проверки в 1С.
